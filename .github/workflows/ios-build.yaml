
name: Build Unsigned IPA

on:
  workflow_dispatch:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/unsigned-ipa.yml"

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Resolve dependencies
        working-directory: ios
        run: |
          xcodebuild -resolvePackageDependencies \
            -project BotRemote.xcodeproj \
            -scheme BotRemote

      - name: Build unsigned app
        working-directory: ios
        run: |
          xcodebuild \
            -project BotRemote.xcodeproj \
            -scheme BotRemote \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package unsigned IPA
        working-directory: ios
        run: |
          mkdir -p "$RUNNER_TEMP/ipa/Payload"

          cp -R \
            build/Build/Products/Release-iphoneos/BotRemote.app \
            "$RUNNER_TEMP/ipa/Payload/"

          cd "$RUNNER_TEMP/ipa"
          zip -qry "$GITHUB_WORKSPACE/BotRemote-unsigned.ipa" Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: BotRemote-Unsigned-IPA
          path: BotRemote-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
