name: BotRemote

options:
  bundleIdPrefix: com.botremote
  deploymentTarget:
    iOS: "16.2"

packages:
  SocketIO:
    url: https://github.com/socketio/socket.io-client-swift
    from: 16.1.1

targets:
  BotRemote:
    type: application
    platform: iOS
    sources:
      - path: BotRemote
        excludes:
          - info.plist
          - "*.entitlements"
    dependencies:
      - package: SocketIO
      - target: BotRemoteLiveActivity
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.botremote.app
        PRODUCT_NAME: BotRemote
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "16.2"
        MARKETING_VERSION: "1.2.0"
        CURRENT_PROJECT_VERSION: "2"
        INFOPLIST_FILE: BotRemote/info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: BotRemote/BotRemote.entitlements

  BotRemoteLiveActivity:
    type: app-extension
    platform: iOS
    sources:
      - path: BotRemoteLiveActivity
        excludes:
          - "*.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.botremote.app.BotRemoteLiveActivity
        PRODUCT_NAME: BotRemoteLiveActivity
        SWIFT_VERSION: "5.0"
        IPHONEOS_DEPLOYMENT_TARGET: "16.2"
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundlePackageType: "XPC!"
        INFOPLIST_KEY_NSExtension_NSExtensionPointIdentifier: com.apple.widgetkit-extension
        CODE_SIGN_ENTITLEMENTS: BotRemoteLiveActivity/BotRemoteLiveActivity.entitlements
